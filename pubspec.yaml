name: clairdocs
description: "ClairDocs - Autonomous Contract and Invoice Dispute Resolution Desktop Application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.5.0
  google_generative_ai: ^0.4.7
  syncfusion_flutter_pdf: ^35.1.43
  syncfusion_flutter_pdfviewer: ^35.1.43
  archive: ^4.6.0
  xml: ^7.0.1
  csv: ^6.0.0
  http: ^1.6.0
  file_picker: ^13.3.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  uuid: ^4.6.0
  intl: ^0.20.3
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.8
  pdf: ^3.13.1
  flutter_dotenv: ^6.0.1
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.5.25
  path: ^1.9.0
  path_provider: ^2.1.2
  fl_chart: ^0.68.0
  mailer: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  msix: ^3.16.7

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

msix_config:
  display_name: 'ClairDocs Enterprise'
  publisher_display_name: 'ClairDocs Corporation'
  identity_name: 'com.clairdocs.desktop'
  msix_version: '1.0.0.0'
  logo_path: 'assets/logo.png'
  protocol_activation: 'clairdocs'
  capabilities: 'internetClient'
